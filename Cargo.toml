[package]
name = "pdfpundit"
version = "0.1.0"
edition = "2024"
resolver = "3"
# Never published (D-047): a crates.io release would be a cat-free way in.
publish = false

[features]
default = ["export"]
# Markdown export (M8), on by default.
export = []
# Optional OCR (M9), off; model delivery is blocked on D-050.
ocr = []

# Pins from plan §3.2. flate2 is transitive only: our own code inflates through
# miniz_oxide's core API and nothing else.
[dependencies]
lopdf = { version = "0.45.0", default-features = false }
miniz_oxide = "=0.9.1"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: floats read back bit-exact (the T-00 goldens carry 17-digit pose values).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
toml = "1.1"
sha2 = "0.11"
thiserror = "2.0"
similar = "3"
unicode-normalization = "0.1"
libm = "0.2.16"
ratatui = "0.30.2"
crossterm = "0.29.0"
hayro = "=0.8.0"
hayro-syntax = "=0.8.0"
hayro-interpret = "=0.8.0"
skrifa = "=0.46.2"
harfrust = "=0.13.3"
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
percent-encoding = "2.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "stdio", "fs", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Console",
  # GetLocalTime, the status bar's clock (T-23a).
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
sha1 = "0.11"

# tests/guard.rs opens a pty for the true case and the input flush (T-23a).
# Dev-only: resolver 3 keeps `pty` out of the shipped graph (eng-r2-q11).
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "termios", "pty"] }

# The C9 salvage tests (T-08, T-08b) inflate hundreds of megabytes of
# candidates; an unoptimised miniz_oxide (and the Adler-32 it runs over every
# candidate's output) makes them minutes long. Release is unaffected.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3
