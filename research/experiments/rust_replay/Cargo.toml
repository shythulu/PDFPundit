[package]
name = "rust_replay"
version = "0.1.0"
edition = "2021"
publish = false

# Does a pure-Rust DEFLATE encoder reproduce stock zlib 1.3 output byte-for-byte on REPDF streams?
# Input: the directory written by ../rust_replay_prep.py. Versions pinned exactly.
[dependencies]
libz-rs-sys = { version = "=0.6.8", default-features = false, features = ["rust-allocator"] }
miniz_oxide = "=0.9.1"

[profile.release]
opt-level = 3
