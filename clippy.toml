# Determinism bans (plan §3.1, D-041, D-076). clippy.toml has no per-path form, so
# these apply crate-wide. Only `src/ui/`, `src/jobs.rs`, `src/panic_guard.rs` and
# `tests/guard.rs` allow the time types; nothing allows the libm methods: use the
# `libm` crate, whose results are the same on every platform.

disallowed-types = [
  { path = "std::time::Instant", reason = "no time on a path that reaches output; budgets count work (D-041)" },
  { path = "std::time::SystemTime", reason = "no time on a path that reaches output; budgets count work (D-041)" },
  { path = "std::time::Duration", reason = "no time on a path that reaches output; budgets count work (D-041)" },
]

# Every f32/f64 method that lowers to platform libm (mul_add falls back to libm fma).
