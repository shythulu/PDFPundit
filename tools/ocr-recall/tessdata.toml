# tessdata_best models for the Tesseract engine (G-11, D-014).
#
# Every model is fetched from the tessdata_best repository (Apache-2.0) at
# the pinned commit, and its sha256 is checked before the first page is read;
# a mismatch fails the run. The models are dev tooling only: nothing ships
# them, and the repository does not commit them.
#
# [routes] maps each script to the models Tesseract reads it with (`-l`
# joins them with `+`). A page's script comes from its manifest `lang`
# (latin: en, fr, es and und; han: zh; arabic: ar; devanagari: hi), never
# from its page index (D-069). Changing a route or a model is an edit here.

[source]
repo = "tesseract-ocr/tessdata_best"
commit = "e12c65a915945e4c28e237a9b52bc4a8f39a0cec"

[routes]
latin = ["eng", "fra", "spa"]
han = ["chi_sim"]
arabic = ["ara"]
devanagari = ["hin"]

