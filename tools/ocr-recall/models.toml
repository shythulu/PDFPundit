# PaddleOCR models for the OCR word-recall harness (T-38b, D-067).
#
# Every model is fetched from its Hugging Face repo at the pinned revision,
# and the sha256 of its `inference.pdiparams` is checked before the first
# page is read; a mismatch fails the run. Names are always passed to
# PaddleOCR explicitly: `PaddleOCR(lang="en")` in 3.7.0 picks the
# PP-OCRv6_medium pair on its own. Revisions and hashes come from the
# eng-r3-fr1 fact report, section 2.
#
# [tiers.<tier>.<script>] routes a page by the script of its manifest `lang`
# (latin: en, fr, es and und; han: zh; arabic: ar; devanagari: hi), never by
# its page index (D-069). Changing a tier or a model is an edit here.

[tiers.tiny.latin]
det = "PP-OCRv6_tiny_det"
rec = "PP-OCRv6_tiny_rec"

[tiers.tiny.han]
det = "PP-OCRv6_tiny_det"
rec = "PP-OCRv6_tiny_rec"

[tiers.tiny.arabic]
det = "PP-OCRv5_mobile_det"
rec = "arabic_PP-OCRv5_mobile_rec"

[tiers.tiny.devanagari]
det = "PP-OCRv5_mobile_det"
rec = "devanagari_PP-OCRv5_mobile_rec"

[tiers.medium.latin]
det = "PP-OCRv6_medium_det"
rec = "PP-OCRv6_medium_rec"

[tiers.medium.han]
det = "PP-OCRv6_medium_det"
rec = "PP-OCRv6_medium_rec"

[tiers.medium.arabic]
det = "PP-OCRv5_mobile_det"
rec = "arabic_PP-OCRv5_mobile_rec"

[tiers.medium.devanagari]
det = "PP-OCRv5_mobile_det"
rec = "devanagari_PP-OCRv5_mobile_rec"

