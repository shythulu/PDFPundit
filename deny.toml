# Dependency policy for `cargo deny` (plan §3.2, FR-g3): licences, bans, sources.
# The licence list is unchanged by F-10. This is a policy for dependencies,
# not the project's own licence, which is the user's decision (D-046).
# No licence exceptions: a package whose licence is not on this list fails the gate.

[licenses]
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unlicense",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
]

# This crate is `publish = false` (D-047) and has no licence yet (D-046); skip it,
# check every dependency.
[licenses.private]
ignore = true

# Dependency gates beyond licences (F-10). A second version of any crate fails
# the gate unless it is listed here; each skip names one exact version, so a
# version bump has to be reviewed again.
[bans]
multiple-versions = "deny"
skip = [
  # Our own inflate code is on 0.9 (plan §3.2); flate2, under hayro-syntax, is on 0.8.
  { crate = "miniz_oxide@0.8.9", reason = "flate2 (via hayro-syntax) is on 0.8; we pin 0.9" },
  # vello_common is on 0.7; hayro and its codecs are on 1.x.
  { crate = "fearless_simd@0.7.0", reason = "vello_common (via hayro) is on 0.7" },
  # kasuari (via ratatui-core) is on 0.16; indexmap, lru, ratatui and vello_cpu are on 0.17.
  { crate = "hashbrown@0.16.1", reason = "kasuari (via ratatui-core) is on 0.16" },
  # Build-time proc-macro crates only: thiserror, strum, phf and friends are on
  # syn 2; serde_derive, bytemuck_derive and the yoke/zerofrom derives are on 3.
  { crate = "syn@2.0.119", reason = "proc-macro split between syn 2 and syn 3" },
]

# Only crates.io: a git or other-registry source fails the gate.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
