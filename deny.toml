# Dependency licence policy (plan §3.2, FR-g3). This is a policy for dependencies,
# not the project's own licence, which is the user's decision (D-046).
# No exceptions: a package whose licence is not on this list fails the gate.

[licenses]
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unlicense",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
]

# This crate is `publish = false` (D-047) and has no licence yet (D-046); skip it,
# check every dependency.
[licenses.private]
ignore = true
